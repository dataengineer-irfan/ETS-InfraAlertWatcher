# ==============================================================================
# Render Infrastructure Blueprint: ETS Expiry Alert System (100% FREE TIER)
# ==============================================================================
# Web Service runs on Render's Free Tier ($0/month).
# Scheduled Daily Checks and Keep-Alive are delegated to GitHub Actions ($0/month)
# to avoid Render's paid cron job charges ($1/month per cron).

services:
  # ----------------------------------------------------------------------------
  # Primary Streamlit Web Application (Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: ets-expiry-alert-system
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_PATH
        value: data/expiry.db
      - key: WORKBOOK_DIR
        value: data
      - key: EXCEL_PATH
        value: data/expiry_source.xlsx
      # HTTPS Email API keys (Free tier over Port 443 - never blocked by Render):
      # - key: RESEND_API_KEY
      #   sync: false
      # - key: BREVO_API_KEY
      #   sync: false
      # Set EXCEL_URL if fetching source workbook dynamically from S3/SharePoint:
      # - key: EXCEL_URL
      #   value: ""
