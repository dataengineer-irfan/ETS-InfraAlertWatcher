name: ETS Watchtower - 100% Free Daily Check & Keep-Alive

on:
  schedule:
    # 1. Keep-Alive Ping every 12 minutes (Prevents Render free tier from sleeping)
    - cron: '*/12 * * * *'
  # 2. Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'daily_check_only'
          - 'keepalive_only'

jobs:
  keepalive-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------------
      # Step 1: 24/7 Keep-Alive Ping (Keeps Render Free Tier Awake)
      # ------------------------------------------------------------------------
      - name: Run Keep-Alive Ping
        if: github.event_name == 'schedule' || inputs.action == 'both' || inputs.action == 'keepalive_only'
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL || 'https://ets-expiry-alert-system.onrender.com' }}
        run: |
          echo "Pinging Render Web Service at $APP_URL to prevent sleep..."
          python scripts/keepalive.py --url "$APP_URL" || echo "Server starting up or offline, ping logged."

      # ------------------------------------------------------------------------
      # Step 2: Daily Expiry Check & Automated Remediation (09:00 UTC)
      # ------------------------------------------------------------------------
      - name: Check Current UTC Hour
        id: check_hour
        run: |
          HOUR=$(date -u +"%H")
          echo "current_hour=$HOUR" >> $GITHUB_OUTPUT

      - name: Run Daily Expiry Pipeline
        if: >
          (github.event_name == 'schedule' && steps.check_hour.outputs.current_hour == '09') ||
          (github.event_name == 'workflow_dispatch' && (inputs.action == 'both' || inputs.action == 'daily_check_only'))
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EXCEL_URL: ${{ secrets.EXCEL_URL }}
        run: |
          echo "Running daily expiry evaluation pipeline..."
          python src/run_daily.py --force
